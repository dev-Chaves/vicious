[project]
name = "vicious-audiobook"
version = "0.1.0"
description = "Local two-pass PDF-to-audiobook pipeline for technical books"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.26",
    "typer>=0.16",
    "mlx-vlm>=0.7.11",
    "numpy>=1.26",
]

[project.scripts]
audiobook = "audiobook.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audiobook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs the MLX speech model (set RUN_MLX=1)",
    "integration: reads the sample PDF from ebook-pdf/",
]
